<!DOCTYPE html>
<html>
<head>
  <title>For You ❤️</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: monospace;
      color: white;
      text-align: center;
      background: linear-gradient(-45deg, #ff4d6d, #ff758f, #ff8fa3, #ffb3c1);
      background-size: 400% 400%;
      animation: gradientBG 10s ease infinite;
    }

    @keyframes gradientBG {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    h1 {
      margin-top: 100px;
      font-size: 40px;
      text-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    button {
      margin-top: 20px;
      padding: 15px 25px;
      border: none;
      font-size: 18px;
      cursor: pointer;
      border-radius: 10px;
      background: white;
      color: #ff4d6d;
      font-weight: bold;
    }

    #output {
      margin-top: 30px;
      font-size: 18px;
      white-space: pre-line;
      padding: 20px;
    }

    .heart {
      position: absolute;
      color: white;
      font-size: 20px;
      animation: floatUp 6s linear infinite;
    }

    @keyframes floatUp {
      0% {transform: translateY(100vh); opacity: 1;}
      100% {transform: translateY(-10vh); opacity: 0;}
    }
  </style>
</head>

<body>

<h1>💖 A Small love For You 💖</h1>
<p>Click to run the heart.exe file</p>

<button onclick="runLove()">Run Program</button>

<div id="output"></div>

<script>
function runLove() {
  let msg = `
> initializing love protocol...
> scanning memories...
> connecting hearts...

ACCESS GRANTED ❤️

You are not just someone special.
You are my favorite notification.
My safest place.
My happiest bug.

unnale unnale vinnada sendrene...!!

Forever yours pattu❤️
  `;

  typeText(msg);
}

function typeText(text) {
  let i = 0;
  document.getElementById("output").innerHTML = "";

  function typing() {
    if (i < text.length) {
      document.getElementById("output").innerHTML += text.charAt(i);
      i++;
      setTimeout(typing, 30);
    }
  }
  typing();
}

// floating hearts
function createHeart() {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "❤️";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = Math.random() * 20 + 10 + "px";
  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 6000);
}

setInterval(createHeart, 300);
</script>

</body>
</html>
